[project]
name = "thinknxg_ess_portal"
authors = [{ name = "Kreatao", email = "hello@kreatao.com" }]
description = "thinkNXG ESS Portal - enterprise Employee Self-Service for thinkNXG HR v16"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
pdf_text = ["pypdf>=4"]
push = ["pywebpush>=2"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"
hrms = ">=16.0.0-dev,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"
